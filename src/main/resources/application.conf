# Глобальные параметры эксперимента.
# Чтобы запустить с другим файлом, не трогая этот: sbt -Dconfig.file=my.conf run
# (в другом файле достаточно указать только изменённые ключи и строку include "application").

equatians {

  world {
    # Сетка секторов: cols — по горизонтали, rows — по вертикали.
    cols = 3
    rows = 2
    # Сторона квадратного сектора в единицах мира. Локальные координаты: [0, sector-size].
    sector-size = 100
  }

  population {
    # Сколько организмов создаётся при генезисе.
    count = 60
    # Начальный сид генератора. «Новый мир» (R) увеличивает его на 1.
    seed = 42
  }

  # Законы мира — одинаковы для всех организмов.
  rules {
    # Радиус, в котором организм замечает других. Видно только свой сектор.
    perception-radius = 25
    # Сколько последних записей журнала хранит каждый организм.
    log-size = 300
    # Сколько погибших помнить, чтобы можно было открыть их журнал.
    graveyard-size = 300

    body {
      # Радиус тела r = k·√(макс. здоровье): площадь пропорциональна весовой категории.
      # Ранения размер не меняют.
      size-per-sqrt-health = 0.35
      # Сколько еды (в единицах жира) даёт тело погибшего на единицу его макс. здоровья.
      # Вместе с оставшимся жиром это и есть то, что можно съесть: сначала убийце, остаток — падаль.
      meat-per-health = 0.5
    }

    energy {
      max-satiety = 100
      # Ёмкость жира пропорциональна максимальному здоровью: max-reserve = k · max-health.
      reserve-per-health = 1.0
      # Сколько единиц сытости даёт одна единица жира.
      reserve-density = 4
      # Расход сытости за тик: r · (base-metabolism + movement-cost · шаг²).
      base-metabolism = 0.01
      movement-cost = 0.02
      # Сколько здоровья теряется на каждую единицу расхода, которую нечем оплатить.
      starvation-damage = 0.5
    }

    healing {
      # Сколько здоровья восстанавливается за тик, пока оно не полное.
      rate = 0.02
      # Сколько сытости стоит единица здоровья (при нехватке — жир по курсу).
      # Без энергии организм не лечится.
      cost = 2.0
    }

    forage {
      # Корм — возобновляемый источник энергии мира: любой организм, у которого функция движения —
      # константа θ(x) = c. Он медленно ползёт по прямой, отражаясь от стен; не ест, не голодает, не убегает
      # и не дерётся — его надо догнать, убить и съесть (тело = meat-per-health · здоровье + жир).
      #
      # Корм размножается делением без партнёра: каждый тик каждый корм с вероятностью
      # reproduction-rate · (1 − n / max-per-sector) отпочковывает клона рядом (n — корма в секторе).
      # Энергию на это он берёт из среды. Гены клона мутируют по общим правилам mutation, а с вероятностью
      # awakening-rate функция движения меняет семейство — клон «пробуждается» и становится активным
      # организмом нового (или уже существующего) вида со своими спящими генами: периодом, span, ударом.
      reproduction-rate = 0.004
      awakening-rate = 0.002
      # Вероятность за тик, что в секторе само появится новый корм — чтобы опустевший сектор ожил.
      spawn-rate = 0.005
      # Больше этого числа кормовых организмов в секторе не бывает.
      max-per-sector = 100
      # Сколько корма в каждом секторе при генезисе.
      initial-per-sector = 10
      # Гены корма, появившегося сам по себе: скорость (медленнее любого обычного организма), здоровье и жир.
      # От здоровья и жира зависит, сколько ударов нужно и сколько в нём еды. Потомки корма наследуют
      # скорость и здоровье с мутациями; жир у каждого нового корма — reserve (но не больше ёмкости).
      speed = 0.15
      health = 3
      reserve = 2
      # Охота на корм: пока доля сытости ниже порога, организм с этой вероятностью за тик идёт за ближайшим кормом.
      # Порог близок к 1, чтобы излишек еды уходил в жир: без жира организмы не готовы к размножению.
      satiety-threshold = 0.98
      probability = 0.5
    }

    scavenging {
      # Если в поле зрения есть падаль, а сытость ниже порога, организм каждый тик
      # с этой вероятностью бросает погоню (в том числе за кормом) или обычное движение и идёт есть.
      # Бегство не прерывает. Падаль — бесплатная еда, поэтому порог не может быть ниже forage.satiety-threshold:
      # всякий, кто готов охотиться на корм, сначала доест падаль.
      probability = 0.9
      satiety-threshold = 0.99
      # На каком расстоянии от края тела можно есть падаль.
      eat-reach = 1.0
    }

    reproduction {
      # Возраст в тиках, с которого организм может размножаться.
      maturity-age = 300
      # Минимальный перерыв между размножениями одного организма, в тиках.
      cooldown = 400
      # Готовность: доли сытости, жира и здоровья не ниже порогов.
      satiety-threshold = 0.6
      reserve-threshold = 0.2
      health-threshold = 0.8
      # Вероятность при очередном решении пойти к готовому партнёру своего вида.
      probability = 0.8
      # Расстояние между краями тел, на котором происходит спаривание.
      reach = 1.0
      # Стоимость одного потомка в сытости, делится поровну между родителями:
      #   тело — body-cost-per-health · макс. здоровье потомка. Должно быть не меньше
      #   body.meat-per-health · energy.reserve-density, иначе рожать и есть падаль своих детей выгодно;
      #   приданое — сытость, с которой рождается потомок, как доля от максимума.
      body-cost-per-health = 3.0
      offspring-satiety = 0.5
      # Помёт — среднее генов litter-size родителей, но рождается столько, сколько родители могут оплатить.
      # Ген litter-size ограничен сверху этим числом.
      max-litter = 5
    }

    mutation {
      # Вероятность мутации каждого числового гена при рождении.
      rate = 0.1
      # Мутация прибавляет нормальный шум с σ = relative-sigma · |ген| + absolute-sigma.
      relative-sigma = 0.15
      absolute-sigma = 0.05
      # Вероятность смены семейства функции. Для функции движения это новый вид.
      family-rate = 0.01
    }

    behaviour {
      # Раз в сколько тиков организм пересматривает поведение, если рядом чужой.
      decision-interval = 15
      # Ниже этой доли сытости организм может начать охоту.
      hunger-threshold = 0.5
      # Вероятность охоты при нулевой сытости; на пороге — 0, между ними линейно.
      max-chase-probability = 0.95
      # Если доли сытости и жира не ниже порогов, организм отдаляется с этой вероятностью.
      flee-satiety-threshold = 0.7
      flee-reserve-threshold = 0.4
      flee-probability = 0.6
      # Преследователь теряет цель, если она дальше perception-radius · этот множитель.
      lose-target-factor = 1.5
    }

    attack {
      # Урон на дистанции d равен D(d / max-reach). Дальность удара — первый ноль D на (0, max-reach].
      max-reach = 15
      # Стоимость удара в сытости = cost-factor · ∫ D по всей дальности (в единицах мира).
      cost-factor = 0.05
      # Урон D(u) умножается на √(макс. здоровье / reference-health): крупный бьёт сильнее,
      # и ранение этого не меняет — весовая категория остаётся прежней.
      reference-health = 40
      # Минимум тиков между ударами одного организма.
      cooldown = 10
    }
  }

  # Диапазоны [min, max], из которых при генезисе случайно и равномерно выбираются гены.
  genesis {
    # Максимальное здоровье. Организмы рождаются с полным здоровьем и 100% сытостью.
    health = [20, 60]
    # Начальный жир — доля от его максимума (который пропорционален здоровью).
    reserve = [0.0, 0.5]
    # Ген «размер помёта» — желаемое число детей за одно размножение (целое).
    litter-size = [1, 3]

    movement {
      # Какие виды (семейства функции движения) появляются в мире.
      # Доступны: constant, linear, quadratic, cubic, logarithmic, sinusoidal, exponential.
      families = [linear, quadratic, cubic, logarithmic, sinusoidal, exponential]
      # За сколько тиков фаза x пробегает отрезок [0, span).
      period = [30, 240]
      # Длина отрезка, по которому пробегает аргумент функции.
      span = [1.0, 6.0]
      # Длина шага за тик, в единицах мира.
      speed = [0.3, 1.5]

      # Курс θ(x) в радианах. Свободные члены — по сути начальный курс, поэтому [0, 2π).
      functions {
        # θ = c. Это семейство корма; обычным видам его можно включить в families.
        constant    { c = [0, 6.283] }
        linear      { a0 = [0, 6.283], a1 = [-3, 3] }
        quadratic   { a0 = [0, 6.283], a1 = [-2, 2], a2 = [-2, 2] }
        cubic       { a0 = [0, 6.283], a1 = [-1, 1], a2 = [-1, 1], a3 = [-1, 1] }
        # a·ln(1 + b·|x|) + c
        logarithmic { a = [-4, 4], b = [0.5, 5], c = [0, 6.283] }
        # a·sin(k·x + φ) + c
        sinusoidal  { a = [0.3, 2], k = [1, 6], phi = [0, 6.283], c = [0, 6.283] }
        # a·e^(b·x) + c
        exponential { a = [-1, 1], b = [-0.8, 0.8], c = [0, 6.283] }
      }
    }

    attack {
      # Семейства функции урона. Вид организма от неё не зависит.
      families = [linear, quadratic, cubic, logarithmic, sinusoidal, exponential]

      # Урон D(u), u = d / max-reach ∈ [0, 1].
      # Функции с D(0) ≤ 0 (бьют в упор в минус) отбрасываются и генерируются заново.
      functions {
        constant    { c = [1, 4] }
        linear      { a0 = [3, 8], a1 = [-12, -2] }
        quadratic   { a0 = [3, 8], a1 = [-6, 2], a2 = [-10, -1] }
        cubic       { a0 = [3, 8], a1 = [-6, 2], a2 = [-6, 2], a3 = [-8, -1] }
        logarithmic { a = [-8, -1], b = [1, 10], c = [3, 8] }
        sinusoidal  { a = [1, 4], k = [2, 8], phi = [0, 6.283], c = [0, 4] }
        exponential { a = [2, 8], b = [-5, -0.5], c = [-2, 1] }
      }
    }
  }

  ui {
    # Ступени ускорения времени, в тиках за кадр (кадров ~60 в секунду).
    speed-steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]
    # Сколько миллисекунд кадра можно потратить на симуляцию.
    frame-budget-ms = 12
    # Длина следа организма, в кадрах.
    trail-length = 120

    # Статистика секторов (окно открывается кликом по пустому месту сектора).
    stats {
      # Раз в сколько тиков снимать перепись населения.
      sample-interval = 50
      # Сколько снимков хранить. При переполнении старые прореживаются вдвое, а интервал удваивается —
      # так история покрывает всё время мира при ограниченной памяти.
      max-samples = 1200
      # Как часто перерисовывать графики открытого окна, мс.
      refresh-ms = 500
    }
  }
}
