# Глобальные параметры эксперимента.
# Чтобы запустить с другим файлом, не трогая этот: sbt -Dconfig.file=my.conf run
# (в другом файле достаточно указать только изменённые ключи и строку include "application").

equatians {

  world {
    # Сетка секторов: cols — по горизонтали, rows — по вертикали.
    cols = 3
    rows = 2
    # Сторона квадратного сектора в единицах мира. Локальные координаты: [0, sector-size].
    sector-size = 100
  }

  population {
    # Сколько организмов создаётся при генезисе.
    count = 60
    # Начальный сид генератора. «Новый мир» (R) увеличивает его на 1.
    seed = 42
  }

  # Законы мира — одинаковы для всех организмов.
  rules {
    # Радиус, в котором организм замечает других. Видно только свой сектор.
    perception-radius = 25
    # Сколько последних записей журнала хранит каждый организм.
    log-size = 300
    # Сколько погибших помнить, чтобы можно было открыть их журнал.
    graveyard-size = 300

    body {
      # Радиус тела r = k·√(макс. здоровье): площадь пропорциональна весовой категории.
      # Ранения размер не меняют.
      size-per-sqrt-health = 0.35
      # Сколько еды (в единицах жира) даёт тело погибшего на единицу его макс. здоровья.
      # Вместе с оставшимся жиром это и есть то, что можно съесть: сначала убийце, остаток — падаль.
      meat-per-health = 0.5
    }

    energy {
      max-satiety = 100
      # Ёмкость жира пропорциональна максимальному здоровью: max-reserve = k · max-health.
      reserve-per-health = 1.0
      # Сколько единиц сытости даёт одна единица жира.
      reserve-density = 4
      # Расход сытости за тик: r · (base-metabolism + movement-cost · шаг²).
      base-metabolism = 0.01
      movement-cost = 0.02
      # Сколько здоровья теряется на каждую единицу расхода, которую нечем оплатить.
      starvation-damage = 0.5
    }

    healing {
      # Сколько здоровья восстанавливается за тик, пока оно не полное.
      rate = 0.02
      # Сколько сытости стоит единица здоровья (при нехватке — жир по курсу).
      # Без энергии организм не лечится.
      cost = 2.0
    }

    scavenging {
      # Если в поле зрения есть падаль, а сытость ниже порога, организм каждый тик
      # с этой вероятностью бросает погоню или обычное движение и идёт есть. Бегство не прерывает.
      probability = 0.9
      satiety-threshold = 0.95
      # На каком расстоянии от края тела можно есть падаль.
      eat-reach = 1.0
    }

    behaviour {
      # Раз в сколько тиков организм пересматривает поведение, если рядом чужой.
      decision-interval = 15
      # Ниже этой доли сытости организм может начать охоту.
      hunger-threshold = 0.5
      # Вероятность охоты при нулевой сытости; на пороге — 0, между ними линейно.
      max-chase-probability = 0.95
      # Если доли сытости и жира не ниже порогов, организм отдаляется с этой вероятностью.
      flee-satiety-threshold = 0.7
      flee-reserve-threshold = 0.4
      flee-probability = 0.6
      # Преследователь теряет цель, если она дальше perception-radius · этот множитель.
      lose-target-factor = 1.5
    }

    attack {
      # Урон на дистанции d равен D(d / max-reach). Дальность удара — первый ноль D на (0, max-reach].
      max-reach = 15
      # Стоимость удара в сытости = cost-factor · ∫ D по всей дальности (в единицах мира).
      cost-factor = 0.05
      # Урон D(u) умножается на √(макс. здоровье / reference-health): крупный бьёт сильнее,
      # и ранение этого не меняет — весовая категория остаётся прежней.
      reference-health = 40
      # Минимум тиков между ударами одного организма.
      cooldown = 10
    }
  }

  # Диапазоны [min, max], из которых при генезисе случайно и равномерно выбираются гены.
  genesis {
    # Максимальное здоровье. Организмы рождаются с полным здоровьем и 100% сытостью.
    health = [20, 60]
    # Начальный жир — доля от его максимума (который пропорционален здоровью).
    reserve = [0.0, 0.5]

    movement {
      # Какие виды (семейства функции движения) появляются в мире.
      # Доступны: linear, quadratic, cubic, logarithmic, sinusoidal, exponential.
      families = [linear, quadratic, cubic, logarithmic, sinusoidal, exponential]
      # За сколько тиков фаза x пробегает отрезок [0, span).
      period = [30, 240]
      # Длина отрезка, по которому пробегает аргумент функции.
      span = [1.0, 6.0]
      # Длина шага за тик, в единицах мира.
      speed = [0.3, 1.5]

      # Курс θ(x) в радианах. Свободные члены — по сути начальный курс, поэтому [0, 2π).
      functions {
        linear      { a0 = [0, 6.283], a1 = [-3, 3] }
        quadratic   { a0 = [0, 6.283], a1 = [-2, 2], a2 = [-2, 2] }
        cubic       { a0 = [0, 6.283], a1 = [-1, 1], a2 = [-1, 1], a3 = [-1, 1] }
        # a·ln(1 + b·|x|) + c
        logarithmic { a = [-4, 4], b = [0.5, 5], c = [0, 6.283] }
        # a·sin(k·x + φ) + c
        sinusoidal  { a = [0.3, 2], k = [1, 6], phi = [0, 6.283], c = [0, 6.283] }
        # a·e^(b·x) + c
        exponential { a = [-1, 1], b = [-0.8, 0.8], c = [0, 6.283] }
      }
    }

    attack {
      # Семейства функции урона. Вид организма от неё не зависит.
      families = [linear, quadratic, cubic, logarithmic, sinusoidal, exponential]

      # Урон D(u), u = d / max-reach ∈ [0, 1].
      # Функции с D(0) ≤ 0 (бьют в упор в минус) отбрасываются и генерируются заново.
      functions {
        linear      { a0 = [3, 8], a1 = [-12, -2] }
        quadratic   { a0 = [3, 8], a1 = [-6, 2], a2 = [-10, -1] }
        cubic       { a0 = [3, 8], a1 = [-6, 2], a2 = [-6, 2], a3 = [-8, -1] }
        logarithmic { a = [-8, -1], b = [1, 10], c = [3, 8] }
        sinusoidal  { a = [1, 4], k = [2, 8], phi = [0, 6.283], c = [0, 4] }
        exponential { a = [2, 8], b = [-5, -0.5], c = [-2, 1] }
      }
    }
  }

  ui {
    # Ступени ускорения времени, в тиках за кадр (кадров ~60 в секунду).
    speed-steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]
    # Сколько миллисекунд кадра можно потратить на симуляцию.
    frame-budget-ms = 12
    # Длина следа организма, в кадрах.
    trail-length = 120
  }
}
